name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev libffi-dev libssl-dev cmake

      - name: Install buildozer
        run: pip install buildozer "cython==0.29.37"

      - name: Build APK
        working-directory: android
        run: yes | buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: pulsedeck-apk
          path: android/bin/*.apk
